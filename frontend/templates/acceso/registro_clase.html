{% extends "base.html" %}
{% load static %}

{% block title %}Registro - Entrada Clase{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Entrada a Clase</h1>
</div>

<div class="card">
    <h2 class="card-title">Registrar Entrada por Clase</h2>

    <form id="formRegistroClase">

        <label>Código del Alumno:</label>
        <input type="number" id="codigoAlumnoClase" required>

        <label>Máquina:</label>
        <select id="maquinaClase" required>
            <option value="">Seleccione...</option>
            <!-- Si deseas se carga dinámicamente -->
        </select>

        <label>Asignatura:</label>
        <select id="asignaturaClase" required>
            <option value="">Seleccione...</option>
            <!-- Se cargan con JS -->
        </select>

        <label>Profesor (asignado automáticamente):</label>
        <select id="profesorClase" required>
            <option value="">Seleccione una asignatura</option>
        </select>

        <div class="modal-actions">
            <button type="submit" class="btn-primary">Registrar Entrada</button>
        </div>
    </form>

    <p id="mensajeClase" class="message"></p>
</div>

{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/api.js' %}"></script>
<script type="module" src="{% static 'js/acceso/registro_clase.js' %}"></script>
{% endblock %}
