{% extends "base.html" %}
{% load static %}

{% block title %}Registro - Salida{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Registrar Salida</h1>
</div>

<div class="card">
    <h2 class="card-title">Salida de Alumno</h2>

    <form id="formSalida">
        <label>Código del Alumno:</label>
        <input type="number" id="codigoAlumnoSalida" required>

        <div class="modal-actions">
            <button type="submit" class="btn-primary">Registrar Salida</button>
        </div>
    </form>

    <p id="mensajeSalida" class="message"></p>
</div>

{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/api.js' %}"></script>
<script type="module" src="{% static 'js/acceso/registro_base.js' %}"></script>
{% endblock %}
