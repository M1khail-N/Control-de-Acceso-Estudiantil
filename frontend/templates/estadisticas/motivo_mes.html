{% extends "base.html" %}
{% load static %}

{% block title %}Estadisticas - Promedio por Motivo{% endblock %}

{% block content %}

<h1>Promedio de Tiempo por Motivo</h1>

<div class="card">

    <form id="formMotivoMes" class="form-grid">
        
        <div>
            <label>Seleccione un mes</label>
            <select id="selectMes">
                <option value="">Seleccione...</option>
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
                <option value="4">Abril</option>
                <option value="5">Mayo</option>
                <option value="6">Junio</option>
                <option value="7">Julio</option>
                <option value="8">Agosto</option>
                <option value="9">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
        </div>

        <div>
            <button type="submit" class="btn-primary">Consultar</button>
        </div>
    </form>
</div>

<div id="mensajeMotivoMes" class="mensaje"></div>

<div class="card" id="tablaCard" style="display:none;">
    <h2>Resultados</h2>
    <table id="tablaResultados">
        <thead>
            <tr>
                <th>Motivo</th>
                <th>Promedio (min)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/estadisticas/motivo_mes.js' %}"></script>
{% endblock %}
