{% extends "base.html" %}
{% load static %}

{% block title %}Estadisticas - Uso del Laboratorio por Semana{% endblock %}

{% block content %}

<h1>Uso del Laboratorio por Semana</h1>

<div class="card">

    <form id="formSemana" class="form-grid">

        <div>
            <label>Semana (1-53)</label>
            <input type="number" id="inputSemana" min="1" max="53" required>
        </div>

        <div>
            <label>Año</label>
            <input type="number" id="inputAnio" min="2000" max="2100" required>
        </div>

        <div>
            <button type="submit" class="btn-primary">Consultar</button>
        </div>

    </form>

</div>

<div id="mensaje" class="mensaje"></div>

<div class="card" id="tablaCard" style="display:none;">
    <h2>Resultados</h2>
    <table id="tablaResultados">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
                <th>Fecha Entrada</th>
                <th>Fecha Salida</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/estadisticas/uso_semana.js' %}"></script>
{% endblock %}
