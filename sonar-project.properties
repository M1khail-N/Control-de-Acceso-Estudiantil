sonar.projectKey=django-project
sonar.projectName=CAEL Django Project
sonar.projectVersion=1.0

# === Directorios a analizar ===
# Solo código Python + frontend
sonar.sources=core,micsv,frontend

# === Exclusiones ===
sonar.exclusions=**/migrations/**, **/__pycache__/**, **/static/**, **/venv/**, **/tests_selenium/**

# === Tests ===
sonar.tests=tests_selenium
sonar.test.inclusions=tests_selenium/**/*.py

# === Coverage (cuando lo generes con pytest) ===
# sonar.python.coverage.reportPaths=coverage.xml

# === Encoding ===
sonar.sourceEncoding=UTF-8

# === URL servidor SonarQube ===
sonar.host.url=http://localhost:9000

# === Token local (NO subir a Git) ===
# sonar.login=sqp_TU_TOKEN_AQUI